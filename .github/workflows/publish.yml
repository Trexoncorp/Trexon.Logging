name: Publish to NuGet

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    if: github.event_name == 'push'
    name: Validate and pack release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(bash scripts/release-version.sh "$RELEASE_TAG")"
          git merge-base --is-ancestor HEAD origin/main || {
            echo '::error::Release tags must point to commits reachable from main.'
            exit 1
          }
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Trexon.Logging.slnx
      - name: Validate documentation and examples
        run: python3 scripts/check-docs.py
      - name: Build
        run: dotnet build Trexon.Logging.slnx --configuration Release --no-restore -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -warnaserror
      - name: Test (.NET 8 and .NET 10)
        run: dotnet test --solution Trexon.Logging.slnx --configuration Release --no-build --no-restore
      - name: Pack
        run: dotnet pack Trexon.Logging/Trexon.Logging.csproj --configuration Release --no-build --output artifacts -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -warnaserror
      - name: Upload release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-release
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish packages
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-release
          path: artifacts
      - name: NuGet login with OIDC
        id: login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ vars.NUGET_USER || 'anton_aleynichenko' }}
      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate
      - name: Publish symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  verify-publishing:
    name: Verify Trusted Publishing (no upload)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ vars.NUGET_USER || 'anton_aleynichenko' }}
